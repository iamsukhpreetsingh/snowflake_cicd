name: CD - Deploy Schema

on:
  workflow_dispatch:

  workflow_run:
    workflows: [ "CI - Validate SQL" ]
    types:
    - completed
    branches:
    - dev
    - main

jobs:
  resolve:
    if: >
      github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.set.outputs.branch }}
      env_name: ${{ steps.set.outputs.env_name }}
    steps:
    - id: set
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          BRANCH="${{ github.ref_name }}"
        else
          BRANCH="${{ github.event.workflow_run.head_branch }}"
        fi

        if [ "$BRANCH" = "main" ]; then
          ENV_NAME="production"
        else
          ENV_NAME="development"
        fi

        echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
        echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.env_name }}

    env:
      SNOWFLAKE_ORGANIZATION_NAME: ${{ secrets.SF_ORGANIZATION_NAME }}
      SNOWFLAKE_ACCOUNT_NAME: ${{ secrets.SF_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SF_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SF_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ vars.APP_ROLE_NAME }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.WAREHOUSE_NAME }}
      SNOWFLAKE_DATABASE: ${{ vars.DATABASE_NAME }}
      SF_READ_ROLE: ${{ secrets.SF_READ_ROLE }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Build Snowflake account identifier
      run: echo "SNOWFLAKE_ACCOUNT=${SNOWFLAKE_ORGANIZATION_NAME}-${SNOWFLAKE_ACCOUNT_NAME}" >> "$GITHUB_ENV"

    - run: pip install schemachange snowflake-connector-python

    - name: Create pre-deploy backup snapshot
      id: backup
      run: python scripts/backup_snapshot.py

    - name: Record deploy start time
      id: start_time
      run: echo "ts=$(date -u +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

    - name: Deploy Objects
      run: |
        schemachange deploy -f objects \
            --vars "{\"db\": \"$SNOWFLAKE_DATABASE\"}" \
            --create-change-history-table

    - name: Post-deployment validation
      run: python scripts/validate_deployment.py "${{ steps.start_time.outputs.ts }}"

    - name: Rollback on failure
      if: failure() && steps.backup.outcome == 'success'
      run: python scripts/rollback.py "${{ steps.backup.outputs.backup_db }}"

    - name: Cleanup backup snapshot
      if: success()
      run: python scripts/cleanup_backup.py "${{ steps.backup.outputs.backup_db }}"
