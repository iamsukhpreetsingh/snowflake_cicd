name: CD - Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY" to confirm production deployment'
        required: true
        default: ''

  workflow_run:
    workflows: ["CI - Validate SQL"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy-prod:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'DEPLOY') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    runs-on: ubuntu-latest
    environment: production

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SF_ACCOUNT_NAME }}
      SNOWFLAKE_USER: ${{ secrets.SF_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SF_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SF_ROLE }}
      SNOWFLAKE_WAREHOUSE: COMPUTE_WH
      SNOWFLAKE_DATABASE: ${{ secrets.SF_DATABASE_PROD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install schemachange snowflake-connector-python

      - name: Create pre-deploy backup snapshot
        id: backup
        run: python scripts/backup_snapshot.py

      - name: Record deploy start time
        id: start_time
        run: echo "ts=$(date -u +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Deploy to Production
        run: |
          schemachange deploy -f objects \
              --vars "{\"db\": \"$SNOWFLAKE_DATABASE\"}" \
              --create-change-history-table

      - name: Post-deployment validation
        run: python scripts/validate_deployment.py "${{ steps.start_time.outputs.ts }}"

      - name: Rollback on failure
        if: failure() && steps.backup.outcome == 'success'
        run: python scripts/rollback.py "${{ steps.backup.outputs.backup_db }}"

      - name: Cleanup backup snapshot
        if: success()
        run: python scripts/cleanup_backup.py "${{ steps.backup.outputs.backup_db }}"

      - name: Notify deployment success
        if: success()
        run: |
          echo "Production deployment completed successfully"
          echo "Database: ${{ env.SNOWFLAKE_DATABASE }}"
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
